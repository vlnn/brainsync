[project]
name = "brainsync"
version = "0.1.0"
description = "Garden crawler and two-way sync between a markdown garden and TheBrain"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
]

[project.scripts]
brainsync = "brainsync.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brainsync"]
